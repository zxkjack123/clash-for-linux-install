port: 7890
socks-port: 7891
allow-lan: false
bind-address: "127.0.0.1"
mode: rule
log-level: info

# Keep controller localhost-only by default.
external-controller: 127.0.0.1:9090
# Security hardening (recommended):
#   clashctl secret init
# Or set a custom secret:
#   clashctl secret <your_secret>
# NOTE: do NOT commit real secrets into this repo.

proxies:
  - name: "JP-Tailscale"
    type: http
    # Replace with your JP exit (e.g. a Tailscale peer running Tinyproxy).
    # Tailscale uses 100.64.0.0/10 by default.
    server: 100.64.0.1
    port: 8888

proxy-groups:
  # Main upstream: JP-only (Tailscale + Tinyproxy)
  - name: "PROXY"
    type: select
    proxies:
      - "JP-Tailscale"
      - "DIRECT"

  # Backward-compatible alias (some tools/rules use "Proxy")
  - name: "Proxy"
    type: select
    proxies:
      - "PROXY"
      - "DIRECT"

  # Dev / academic workflow groups (all JP-only, just more observable/switchable)
  - name: "DEV"
    type: select
    proxies:
      - "PROXY"
      - "DIRECT"

  - name: "COPILOT"
    type: select
    proxies:
      - "PROXY"
      - "DIRECT"

  - name: "DOCKER"
    type: select
    proxies:
      - "PROXY"
      - "DIRECT"

  - name: "ACADEMIC"
    type: select
    proxies:
      - "PROXY"
      - "DIRECT"

rules:
  # Tailnet/local: avoid proxy loops when system proxy is enabled.
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve

  # VS Code Copilot (place early; overrides broad GitHub rules)
  - DOMAIN,api.githubcopilot.com,COPILOT
  - DOMAIN,api.individual.githubcopilot.com,COPILOT
  - DOMAIN,copilot-proxy.githubusercontent.com,COPILOT
  - DOMAIN-SUFFIX,githubcopilot.com,COPILOT

  # Docker / OCI registries
  - DOMAIN,registry-1.docker.io,DOCKER
  - DOMAIN,auth.docker.io,DOCKER
  - DOMAIN,production.cloudflare.docker.com,DOCKER
  - DOMAIN-SUFFIX,docker.com,DOCKER
  - DOMAIN-SUFFIX,docker.io,DOCKER
  - DOMAIN-SUFFIX,ghcr.io,DOCKER

  # Scholar / academic sites (minimal, extensible)
  - DOMAIN,scholar.google.com,ACADEMIC
  - DOMAIN-SUFFIX,scholar.googleusercontent.com,ACADEMIC
  - DOMAIN,api.semanticscholar.org,ACADEMIC
  - DOMAIN-SUFFIX,semanticscholar.org,ACADEMIC
  - DOMAIN-SUFFIX,arxiv.org,ACADEMIC
  - DOMAIN-SUFFIX,doi.org,ACADEMIC
  - DOMAIN-SUFFIX,sciencedirect.com,ACADEMIC
  - DOMAIN,link.springer.com,ACADEMIC
  - DOMAIN-SUFFIX,springer.com,ACADEMIC
  - DOMAIN,ieeexplore.ieee.org,ACADEMIC
  - DOMAIN-SUFFIX,ieee.org,ACADEMIC
  - DOMAIN,dl.acm.org,ACADEMIC
  - DOMAIN-SUFFIX,acm.org,ACADEMIC
  - DOMAIN,onlinelibrary.wiley.com,ACADEMIC
  - DOMAIN-SUFFIX,wiley.com,ACADEMIC
  - DOMAIN-SUFFIX,nature.com,ACADEMIC
  - DOMAIN-SUFFIX,springernature.com,ACADEMIC
  - DOMAIN-SUFFIX,jstor.org,ACADEMIC
  - DOMAIN-SUFFIX,mdpi.com,ACADEMIC
  - DOMAIN-SUFFIX,frontiersin.org,ACADEMIC
  - DOMAIN-SUFFIX,ncbi.nlm.nih.gov,ACADEMIC
  - DOMAIN-SUFFIX,nih.gov,ACADEMIC

  # GitHub (dev)
  - DOMAIN-SUFFIX,githubusercontent.com,DEV
  - DOMAIN-SUFFIX,github.com,DEV
  - DOMAIN-SUFFIX,github.io,DEV
  - DOMAIN-SUFFIX,githubassets.com,DEV

  # Google base (non-Scholar)
  - DOMAIN-SUFFIX,google.com,PROXY
  - DOMAIN-SUFFIX,googleapis.com,PROXY
  - DOMAIN-SUFFIX,gstatic.com,PROXY

  # China academic network
  - DOMAIN-SUFFIX,scnet.cn,DIRECT

  - MATCH,DIRECT
