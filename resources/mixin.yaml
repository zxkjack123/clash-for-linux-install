# User overrides (mixin)
#
# Why mixin:
# - Subscription updates may overwrite resources/config.yaml.
# - Mixin is merged into runtime.yaml and has higher priority.
#
# Notes:
# - Rule order matters. This project’s runtime sanitizer will keep GEOIP/MATCH at the end,
#   so these rules won’t be shadowed by a trailing MATCH,DIRECT.

rules:
  # Block link-local IMDS (169.254.169.254) — VS Code extensions probe cloud metadata
  # on physical workstations; these always fail and pollute connection failure counts.
  - IP-CIDR,169.254.0.0/16,REJECT,no-resolve

  # CAS / ASIPP intranet (force DIRECT, never via proxy)
  # - 202.127.200.0/21  HFCASNET = Hefei Branch of CAS (含等离子体所 ASIPP, 如 202.127.204.49)
  # - 159.226.0.0/16    CAS Beijing CNIC (含 www.ipp.cas.cn 159.226.242.225 等公网入口)
  # Note: off-campus access still requires ASIPP VPN if the target site enforces source-IP allowlist;
  #       these rules only ensure Clash itself does not divert traffic to a proxy egress.
  - IP-CIDR,202.127.200.0/21,DIRECT,no-resolve
  - IP-CIDR,159.226.0.0/16,DIRECT,no-resolve
  - DOMAIN-SUFFIX,ipp.cas.cn,DIRECT
  - DOMAIN-SUFFIX,cas.cn,DIRECT
  - DOMAIN-SUFFIX,ipp.ac.cn,DIRECT
  - DOMAIN-SUFFIX,hfcas.ac.cn,DIRECT

  # DeepSeek (Chinese AI service; routing via overseas proxy adds 5+s TLS handshake and frequent drops)
  - DOMAIN-SUFFIX,deepseek.com,DIRECT

