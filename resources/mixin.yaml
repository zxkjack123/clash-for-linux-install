dns:
  enable: true
  ipv6: false
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  fallback:
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite: [gfw]
    ipcidr: [240.0.0.0/4]
  domain: [+.google.com, +.facebook.com, +.youtube.com, +.zoom.us]
  nameserver-policy:
    "+.qdai.scnet.cn":
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
    "+.scnet.cn":
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
  fake-ip-filter:
    - api.individual.githubcopilot.com
    - "*.github.com"
    - "*.githubusercontent.com"
    - github.com
    - githubusercontent.com
    - "githubassets.com"
    - "vscode-cdn.net"
    - "trafficmanager.net"
    - "chat.openai.com"
    - "platform.openai.com"
    - "*.openai.com"
    - "claude.ai"
    - "*.claude.ai"
    - "*.qdai.scnet.cn"
    - "*.scnet.cn"
    - "sg.uiuiapi.com"
    - "*.uiuiapi.com"
    - "*.siliconflow.cn"
    - "openrouter.ai"
    - "*.openrouter.ai"
    - "api.openrouter.ai" # legacy endpoint (no longer active but kept for compatibility)
    - "*.zoom.us"
    - "zoom.us"
    - "*.zoomcdn.net"
    - "zoomcdn.net"

# 如需额外规则覆盖可继续添加 rules: 键; 这里新增 QDAI 修复与常用开发/AI/会议规则
rules:
  # GitHub Copilot: force DIRECT to avoid flaky proxy paths (SSE/HTTP2/WebSocket)
  - DOMAIN,api.githubcopilot.com,DIRECT
  - DOMAIN,api.individual.githubcopilot.com,DIRECT
  - DOMAIN-SUFFIX,githubcopilot.com,DIRECT
  - DOMAIN,copilot-proxy.githubusercontent.com,DIRECT
  # GitHub core API/auth: prefer DIRECT to ensure VS Code sign-in and API calls when proxies are unstable
  - DOMAIN,api.github.com,DIRECT
  - DOMAIN,github.com,DIRECT
  # QDAI 临时子域解析 / 访问修复 (必须放在 DOMAIN-SUFFIX,cn,DIRECT 之前)
  - DOMAIN,c-1966322474660876290.qdai.scnet.cn,DIRECT
