# ============================================================================
# Proxy groups override
# ----------------------------------------------------------------------------
# The merge logic (_merge_build_runtime) concatenates [mixin + raw + mixin] and
# dedupes by name keeping the LAST occurrence, so any group defined here wins
# over the subscription / raw template.
#
# IMPORTANT: mihomo persists the currently-selected member of every "select"
# group in cache.db, so simply listing AUTO first does NOT guarantee AUTO is
# active after a restart — it will restore whatever was selected last. To
# really pin AUTO as the default, ALSO clear the selector cache on (re)start.
# This is wired up via systemd ExecStartPre in mihomo.service.
# ============================================================================
proxy-groups:
  # Auto-select lowest-latency node (tolerance 200ms to avoid flapping)
  - name: "AUTO"
    type: url-test
    proxies:
      - "JP-Tailscale"
      - "US-Tailscale"
    url: "https://www.gstatic.com/generate_204"
    interval: 30
    tolerance: 200

  # Main upstream selector — AUTO listed first so a fresh cache.db picks it
  - name: "PROXY"
    type: select
    proxies:
      - "AUTO"
      - "JP-Tailscale"
      - "US-Tailscale"
      - "DIRECT"

  # Academic publishers — institution-based access (Shibboleth / IP allowlist /
  # EZproxy) is bound to the local egress IP. Going through an overseas proxy
  # makes the publisher classify the request as unaffiliated and demand a fee.
  # DIRECT first so a fresh cache.db pins DIRECT.
  - name: "ACADEMIC"
    type: select
    proxies:
      - "DIRECT"
      - "PROXY"
