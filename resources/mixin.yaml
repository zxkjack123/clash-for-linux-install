#############################################
# mixin.yaml (clean structure)
# 目的:
#  1. 仅覆盖需要的 proxy-groups 与精简 DNS
#  2. 保持手动选择, 避免启动并发测速
#  3. 新增 qdai.scnet.cn 解析与路由修复
#############################################

proxy-groups:
  - name: 自动选择
    type: select
    proxies:
      - AUTO-SMART
      - V1-香港01
      - DIRECT
  - name: 故障转移
    type: select
    proxies:
      - AUTO-SMART
      - V1-香港01
      - DIRECT
  - name: 西瓜加速
    type: select
    proxies:
      - AUTO-SMART
      - V1-香港01
  - name: AUTO-SMART
    type: url-test
    proxies:
      - V1-日本01|流媒体|GPT
      - V1-日本02|流媒体|GPT
      - V1-日本03|流媒体|GPT
      - V1-日本04|流媒体|GPT
      - V1-香港01
      - V1-香港02
      - V1-香港03
      - V1-香港04
      - V2-香港07
      - V1-新加坡01|流媒体|GPT
      - V1-新加坡02|流媒体|GPT
      - V1-新加坡03|流媒体|GPT
      - V1-新加坡04|流媒体|GPT
      - V2-新加坡05|流媒体|GPT
      - V2-新加坡06|流媒体|GPT
      - V1-韩国01
      - V1-韩国02
      - V2-韩国03
      - V2-韩国04
      - "V1-台湾省01|流媒体|GPT"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: AI
    type: select
    proxies:
      - V1-美国01|流媒体|GPT
      - V1-美国02|流媒体|GPT
      - V1-美国03|流媒体|GPT
      - V1-新加坡01|流媒体|GPT
      - V1-日本01|流媒体|GPT
  - name: Development
    type: select
    proxies:
      - AUTO-SMART
      - V1-香港01
      - V1-新加坡01|流媒体|GPT
      - V1-日本01|流媒体|GPT
      - V1-美国01|流媒体|GPT
  - name: Streaming
    type: select
    proxies:
      - AUTO-SMART
      - V1-香港01
      - V1-新加坡01|流媒体|GPT
      - V1-日本01|流媒体|GPT
      - V1-美国01|流媒体|GPT
  - name: Gaming
    type: select
    proxies:
      - AUTO-SMART
      - V1-香港01
      - V1-香港02
      - V1-日本01|流媒体|GPT
      - V1-韩国01

dns:
  enable: true
  ipv6: false
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  fallback:
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite: [gfw]
    ipcidr: [240.0.0.0/4]
  domain: [+.google.com, +.facebook.com, +.youtube.com, +.zoom.us]
  nameserver-policy:
    "+.qdai.scnet.cn":
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
  fake-ip-filter:
    - api.individual.githubcopilot.com
    - "*.github.com"
    - "*.githubusercontent.com"
    - github.com
    - githubusercontent.com
    - "githubassets.com"
    - "vscode-cdn.net"
    - "trafficmanager.net"
    - "chat.openai.com"
    - "platform.openai.com"
    - "*.openai.com"
    - "claude.ai"
    - "*.claude.ai"
    - "*.qdai.scnet.cn"
    - "*.zoom.us"
    - "zoom.us"
    - "*.zoomcdn.net"
    - "zoomcdn.net"

# 如需额外规则覆盖可继续添加 rules: 键; 这里新增 QDAI 修复与常用开发/AI/会议规则
rules:
  # GitHub Copilot: force DIRECT to avoid flaky proxy paths (SSE/HTTP2/WebSocket)
  - DOMAIN,api.githubcopilot.com,DIRECT
  - DOMAIN,api.individual.githubcopilot.com,DIRECT
  - DOMAIN-SUFFIX,githubcopilot.com,DIRECT
  - DOMAIN,copilot-proxy.githubusercontent.com,DIRECT
  # GitHub core API/auth: prefer DIRECT to ensure VS Code sign-in and API calls when proxies are unstable
  - DOMAIN,api.github.com,DIRECT
  - DOMAIN,github.com,DIRECT
  # QDAI 临时子域解析 / 访问修复 (必须放在 DOMAIN-SUFFIX,cn,DIRECT 之前)
  - DOMAIN,c-1966322474660876290.qdai.scnet.cn,AI
  - DOMAIN-SUFFIX,qdai.scnet.cn,AI
  # Tailscale / Funnel
  - DOMAIN-SUFFIX,ts.net,DIRECT
  - DOMAIN-SUFFIX,tailscale.io,DIRECT
  - IP-CIDR,100.100.100.100/32,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,1.1.1.1/32,DIRECT,no-resolve
  - IP-CIDR,8.8.8.8/32,DIRECT,no-resolve
  # GitHub / Dev
  # Copilot rules are DIRECT above; keep other dev endpoints via Development
  - DOMAIN-SUFFIX,githubusercontent.com,Development
  - DOMAIN-SUFFIX,githubassets.com,Development
  - DOMAIN-KEYWORD,github,Development
  - DOMAIN-SUFFIX,vscode-cdn.net,Development
  - DOMAIN-SUFFIX,trafficmanager.net,Development
  - DOMAIN-SUFFIX,gitlab.com,Development
  - DOMAIN-SUFFIX,stackoverflow.com,Development
  - DOMAIN-SUFFIX,stackexchange.com,Development
  - DOMAIN-SUFFIX,npmjs.com,Development
  - DOMAIN-SUFFIX,registry.npmjs.org,Development
  - DOMAIN-SUFFIX,pypi.org,Development
  - DOMAIN-SUFFIX,files.pythonhosted.org,Development
  - DOMAIN-SUFFIX,crates.io,Development
  - DOMAIN-SUFFIX,static.crates.io,Development
  - DOMAIN-SUFFIX,rustup.rs,Development
  - DOMAIN-SUFFIX,go.dev,Development
  - DOMAIN-SUFFIX,golang.org,Development
  - DOMAIN-SUFFIX,proxy.golang.org,Development
  - DOMAIN-SUFFIX,registry-1.docker.io,Development
  - DOMAIN-SUFFIX,auth.docker.io,Development
  - DOMAIN-SUFFIX,production.cloudflare.docker.com,Development
  - DOMAIN-SUFFIX,ghcr.io,Development
  - DOMAIN-SUFFIX,quay.io,Development
  - DOMAIN-SUFFIX,registry.k8s.io,Development
  # 国内镜像直连
  - DOMAIN-SUFFIX,gitee.com,DIRECT
  - DOMAIN-SUFFIX,goproxy.cn,DIRECT
  - DOMAIN-SUFFIX,mirrors.tuna.tsinghua.edu.cn,DIRECT
  - DOMAIN-SUFFIX,mirrors.ustc.edu.cn,DIRECT
  - DOMAIN-SUFFIX,mirrors.aliyun.com,DIRECT
  - DOMAIN-SUFFIX,developer.aliyun.com,DIRECT
  - DOMAIN-SUFFIX,aliyun.com,DIRECT
  - DOMAIN-SUFFIX,cloud.tencent.com,DIRECT
  - DOMAIN-SUFFIX,huaweicloud.com,DIRECT
  # 会议/Streaming
  - DOMAIN-SUFFIX,zoom.us,Streaming
  - DOMAIN-KEYWORD,zoom,Streaming
  - DOMAIN-SUFFIX,zoomcdn.net,Streaming
  - DOMAIN-SUFFIX,youtube.com,Streaming
  - DOMAIN-SUFFIX,youtu.be,Streaming
  - DOMAIN-SUFFIX,googlevideo.com,Streaming
  # AI / 模型
  - DOMAIN-SUFFIX,huggingface.co,AI
