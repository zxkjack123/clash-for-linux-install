#############################################
# mixin.yaml (re-written clean structure)
# 目的:
#  1. 仅覆盖需要的 proxy-groups 与精简 DNS, 避免原文件多次 "name:" 顶级键导致 YAML 失效
#  2. 不自动测速; 由脚本 auto_optimize_clash.sh 注入 / 维护 AUTO-SMART 列表
#  3. 避免 1.1.1.1 / 8.8.8.8 在网络受限场景造成循环失败; 后续稳定后可再加入
# 使用: 修改后执行(人工): clashon 或 clashctl mixin -e 保存后自动合并
#############################################

proxy-groups:
  - name: 自动选择
    # 覆盖订阅里的同名 url-test 分组，改为 select 避免启动并发测速
    type: select
    proxies:
      - AUTO-SMART
      - V1-香港01
      - DIRECT
  - name: 故障转移
    # 覆盖订阅里的同名 fallback 分组，改为 select 手动控制
    type: select
    proxies:
      - AUTO-SMART
      - V1-香港01
      - DIRECT
  - name: 西瓜加速
    type: select
    proxies:
      - AUTO-SMART
      - V1-香港01
  - name: AUTO-SMART
    # 初始保持 select, 避免 mihomo 启动时并发测速; 脚本可在确认列表后改为 url-test
    type: select
    proxies:
      - V1-越南05|GPT
      - V1-越南03|GPT
      - V1-印尼01
      - V1-越南06|GPT
      - V1-日本02|流媒体|GPT
      - V2-香港07
      - V1-越南01|GPT
      - V1-日本03|流媒体|GPT
  - name: AI
    type: select
    proxies:
      - V1-美国01|流媒体|GPT
      - V1-美国02|流媒体|GPT
      - V1-美国03|流媒体|GPT
  - name: Development
    type: select
    proxies:
      - AUTO-SMART
      - V1-香港01
      - V1-新加坡01|流媒体|GPT
      - V1-日本01|流媒体|GPT
      - V1-美国01|流媒体|GPT
  - name: Streaming
    type: select
    proxies:
      - AUTO-SMART
      - V1-香港01
      - V1-新加坡01|流媒体|GPT
      - V1-日本01|流媒体|GPT
      - V1-美国01|流媒体|GPT
  - name: Gaming
    type: select
    proxies:
      - AUTO-SMART
      - V1-香港01
      - V1-香港02
      - V1-日本01|流媒体|GPT
      - V1-韩国01
dns:
  # 仅在需要覆盖的字段写入; 其余保持订阅原值(merge 后存在则按 mixin 优先)
  enable: true
  ipv6: false
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  fallback:
    # 仅使用国内可达 DoH 作为补充, 强制移除 1.1.1.1 / 8.8.8.8 避免循环
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite: [gfw]
    ipcidr: [240.0.0.0/4]
  domain: [+.google.com, +.facebook.com, +.youtube.com, +.zoom.us]
  fake-ip-filter:
    - api.individual.githubcopilot.com
    - "*.github.com"
    - "*.githubusercontent.com"
    - github.com
    - githubusercontent.com
    - "githubassets.com"
    - "vscode-cdn.net"
    - "trafficmanager.net"
    - "chat.openai.com"
    - "platform.openai.com"
    - "*.openai.com"
    - "claude.ai"
    - "*.claude.ai"
  # Zoom Web/Client 对 Fake-IP 敏感，强制真实 IP 解析
  - "*.zoom.us"
  - "zoom.us"
  - "*.zoomcdn.net"
  - "zoomcdn.net"
# 规则删除/替换策略: 若后续需要移除订阅里对 1.1.1.1 / 8.8.8.8 的 IP-CIDR 强制代理, 可追加 rules:
# rules: （下方已增加部分高优先级规则）
#   - 'DOMAIN-SUFFIX,example.com,DIRECT'

rules:
  # Tailscale / Funnel / Tailnet 优先直连，避免走代理导致 127.0.0.1:7890 回环失败或出口劫持
  - DOMAIN-SUFFIX,ts.net,DIRECT
  - DOMAIN-SUFFIX,tailscale.io,DIRECT
  - IP-CIDR,100.100.100.100/32,DIRECT,no-resolve # Tailscale 内部 DNS 服务器直连
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  # 基础 DNS 公共递归直连，避免走失效代理节点产生循环
  - IP-CIDR,1.1.1.1/32,DIRECT,no-resolve
  - IP-CIDR,8.8.8.8/32,DIRECT,no-resolve
  # GitHub / Copilot / VSCode 相关流量指向 Development (含 AUTO-SMART)
  - DOMAIN,api.individual.githubcopilot.com,Development
  - DOMAIN-SUFFIX,githubcopilot.com,Development
  - DOMAIN-SUFFIX,githubusercontent.com,Development
  - DOMAIN-SUFFIX,githubassets.com,Development
