# User overrides (mixin)
#
# Why mixin:
# - Subscription updates may overwrite resources/config.yaml.
# - Mixin is merged into runtime.yaml and has higher priority.
#
# Notes:
# - Rule order matters. This project’s runtime sanitizer will keep GEOIP/MATCH at the end,
#   so these rules won’t be shadowed by a trailing MATCH,DIRECT.

rules:
  # Block link-local IMDS (169.254.169.254) — VS Code extensions probe cloud metadata
  # on physical workstations; these always fail and pollute connection failure counts.
  - IP-CIDR,169.254.0.0/16,REJECT,no-resolve

  # Wikipedia / Wikimedia family (force proxy; direct may be blocked or DNS-poisoned)
  - DOMAIN-SUFFIX,wikipedia.org,PROXY
  - DOMAIN-SUFFIX,wikimedia.org,PROXY
  - DOMAIN-SUFFIX,wikidata.org,PROXY
  - DOMAIN-SUFFIX,mediawiki.org,PROXY
  - DOMAIN-SUFFIX,wiktionary.org,PROXY
  - DOMAIN-SUFFIX,wikisource.org,PROXY
  - DOMAIN-SUFFIX,wikibooks.org,PROXY
  - DOMAIN-SUFFIX,wikiquote.org,PROXY
  - DOMAIN-SUFFIX,wikinews.org,PROXY
  - DOMAIN-SUFFIX,wikiversity.org,PROXY
  - DOMAIN-SUFFIX,w.wiki,PROXY

  # Amazon family (direct from China triggers anti-bot 503 or SSL timeout)
  - DOMAIN-SUFFIX,amazon.com,PROXY
  - DOMAIN-SUFFIX,amazon.co.jp,PROXY
  - DOMAIN-SUFFIX,amazon.co.uk,PROXY
  - DOMAIN-SUFFIX,amazon.de,PROXY
  - DOMAIN-SUFFIX,ssl-images-amazon.com,PROXY
  - DOMAIN-SUFFIX,media-amazon.com,PROXY
  - DOMAIN-SUFFIX,images-amazon.com,PROXY
  - DOMAIN-SUFFIX,amazonaw.com,PROXY

  # HuggingFace (direct from China triggers connection reset / ERR_CONNECTION_CLOSED)
  - DOMAIN-SUFFIX,huggingface.co,PROXY
  - DOMAIN-SUFFIX,hf.co,PROXY
  - DOMAIN-SUFFIX,huggingface.com,PROXY
