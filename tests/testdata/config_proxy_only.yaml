# Config with only PROXY and AUTO groups — no ACADEMIC, no COPILOT
# Tests Scholar fallback to AUTO, Copilot fallback to DIRECT

proxies:
  - name: "TestProxy"
    type: ss
    server: 127.0.0.1
    port: 8388
    cipher: aes-256-gcm
    password: test

proxy-groups:
  - name: "AUTO"
    type: url-test
    proxies:
      - "TestProxy"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
  - name: "PROXY"
    type: select
    proxies:
      - "AUTO"
      - "DIRECT"

rules:
  - "GEOIP,CN,DIRECT"
  - "MATCH,DIRECT"
